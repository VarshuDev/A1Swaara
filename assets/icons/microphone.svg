<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes mic-pulse {
        0%, 100% { fill: #20cfff; }
        50% { fill: #ff2daa; }
      }
      .mic-head {
        animation: mic-pulse 1.8s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- Mic capsule -->
  <rect class="mic-head" x="9" y="3" width="6" height="10" rx="3"/>
  <!-- Stand curve -->
  <path d="M 5 10 A 7 7 0 0 0 19 10" fill="none" stroke="#7f52ff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Stem & base -->
  <line x1="12" y1="17" x2="12" y2="21" stroke="#7f52ff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="8" y1="21" x2="16" y2="21" stroke="#7f52ff" stroke-width="1.8" stroke-linecap="round"/>
</svg>
