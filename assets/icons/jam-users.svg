<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes jam-pulse {
        0%, 100% { stroke: #20cfff; }
        50% { stroke: #ff2daa; }
      }
      .link {
        animation: jam-pulse 1.8s ease-in-out infinite;
      }
    </style>
  </defs>
  <!-- Connecting link -->
  <line class="link" x1="8" y1="8" x2="16" y2="8" stroke="#20cfff" stroke-width="1.5" stroke-dasharray="2, 2"/>
  <!-- User 1 -->
  <circle cx="8" cy="8" r="3" fill="#20cfff"/>
  <path d="M 4 17 C 4 14 6 13 8 13 C 10 13 12 14 12 17" fill="none" stroke="#20cfff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- User 2 -->
  <circle cx="16" cy="8" r="3" fill="#ff2daa"/>
  <path d="M 12 17 C 12 14 14 13 16 13 C 18 13 20 14 20 17" fill="none" stroke="#ff2daa" stroke-width="1.5" stroke-linecap="round"/>
</svg>
