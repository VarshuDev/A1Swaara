<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes screen-glow {
        0%, 100% { stroke: #20cfff; filter: drop-shadow(0 0 2px rgba(32, 207, 255, 0.4)); }
        50% { stroke: #ff2daa; filter: drop-shadow(0 0 6px rgba(255, 45, 170, 0.8)); }
      }
      @keyframes wave-bounce {
        0%, 100% { height: 3px; y: 12px; }
        50% { height: 7px; y: 10px; }
      }
      .phone { animation: screen-glow 2.5s ease-in-out infinite; }
      .bar { animation: wave-bounce 1.2s ease-in-out infinite; }
    </style>
  </defs>
  <rect class="phone" x="6" y="2" width="12" height="20" rx="3" fill="#0d101a" stroke="#20cfff" stroke-width="1.6"/>
  <line x1="10" y1="5" x2="14" y2="5" stroke="#334155" stroke-width="1" stroke-linecap="round"/>
  <!-- Mini audio bars on screen -->
  <rect class="bar" x="8.5" y="11" width="1.5" height="5" rx="0.75" fill="#20cfff"/>
  <rect class="bar" x="11.25" y="9" width="1.5" height="8" rx="0.75" fill="#ff2daa" style="animation-delay: 0.3s;"/>
  <rect class="bar" x="14" y="11" width="1.5" height="5" rx="0.75" fill="#7f52ff" style="animation-delay: 0.6s;"/>
</svg>
