<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <style>
      @keyframes spin-mesh {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulse-node {
        0%, 100% { fill: #20cfff; }
        50% { fill: #ff2daa; }
      }
      .mesh-spin {
        animation: spin-mesh 8s linear infinite;
        transform-origin: 12px 12px;
      }
      .node {
        animation: pulse-node 2s ease-in-out infinite;
      }
    </style>
  </defs>
  <g class="mesh-spin">
    <circle cx="12" cy="4" r="2.5" class="node"/>
    <circle cx="19" cy="8" r="2.5" class="node"/>
    <circle cx="19" cy="16" r="2.5" class="node"/>
    <circle cx="12" cy="20" r="2.5" class="node"/>
    <circle cx="5" cy="16" r="2.5" class="node"/>
    <circle cx="5" cy="8" r="2.5" class="node"/>
    <polygon points="12,4 19,8 19,16 12,20 5,16 5,8" fill="none" stroke="#7f52ff" stroke-width="1.2" stroke-dasharray="3, 2"/>
    <line x1="12" y1="4" x2="12" y2="20" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
  </g>
  <circle cx="12" cy="12" r="2" fill="#ffffff"/>
</svg>
