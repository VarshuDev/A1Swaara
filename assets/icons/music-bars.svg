<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <linearGradient id="mbGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#20cfff"/>
      <stop offset="100%" stop-color="#ff2daa"/>
    </linearGradient>
    <style>
      @keyframes eq1 { 0%, 100% { height: 6px; y: 14px; } 50% { height: 16px; y: 4px; } }
      @keyframes eq2 { 0%, 100% { height: 15px; y: 5px; } 50% { height: 7px; y: 13px; } }
      @keyframes eq3 { 0%, 100% { height: 9px; y: 11px; } 50% { height: 18px; y: 2px; } }
      @keyframes eq4 { 0%, 100% { height: 16px; y: 4px; } 50% { height: 6px; y: 14px; } }
      .mb-1 { animation: eq1 1.1s ease-in-out infinite; }
      .mb-2 { animation: eq2 0.85s ease-in-out infinite; }
      .mb-3 { animation: eq3 1.3s ease-in-out infinite; }
      .mb-4 { animation: eq4 0.95s ease-in-out infinite; }
    </style>
  </defs>
  <rect class="mb-1" x="2.5" y="14" width="3.5" height="6" rx="1.5" fill="url(#mbGrad)"/>
  <rect class="mb-2" x="8" y="5" width="3.5" height="15" rx="1.5" fill="url(#mbGrad)"/>
  <rect class="mb-3" x="13.5" y="11" width="3.5" height="9" rx="1.5" fill="url(#mbGrad)"/>
  <rect class="mb-4" x="19" y="4" width="3.5" height="16" rx="1.5" fill="url(#mbGrad)"/>
</svg>
