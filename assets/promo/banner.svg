<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%">
  <defs>
    <!-- Deep obsidian ambient glow -->
    <radialGradient id="glow" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ff2daa" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#7f52ff" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#20cfff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#07080d" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon laser beam gradient -->
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20cfff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#20cfff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff2daa" stop-opacity="1"/>
      <stop offset="75%" stop-color="#7f52ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#20cfff" stop-opacity="0"/>
    </linearGradient>

    <!-- Equalizer bar gradient -->
    <linearGradient id="eq-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#20cfff"/>
      <stop offset="50%" stop-color="#7f52ff"/>
      <stop offset="100%" stop-color="#ff2daa"/>
    </linearGradient>

    <!-- Circuit grid -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#161826" stroke-width="0.8" opacity="0.7"/>
      <circle cx="0" cy="0" r="1" fill="#2c314c" opacity="0.6"/>
    </pattern>

    <!-- Card border clip -->
    <clipPath id="card-clip">
      <rect width="920" height="310" rx="16"/>
    </clipPath>

    <style>
      @keyframes sweep {
        0% { transform: translateX(-920px); }
        100% { transform: translateX(920px); }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      @keyframes eq-bounce-1 {
        0%, 100% { height: 14px; y: 166px; }
        50% { height: 40px; y: 140px; }
      }
      @keyframes eq-bounce-2 {
        0%, 100% { height: 34px; y: 146px; }
        50% { height: 16px; y: 164px; }
      }
      @keyframes eq-bounce-3 {
        0%, 100% { height: 24px; y: 156px; }
        50% { height: 48px; y: 132px; }
      }
      @keyframes eq-bounce-4 {
        0%, 100% { height: 44px; y: 136px; }
        50% { height: 22px; y: 158px; }
      }
      .beam-sweep {
        animation: sweep 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pulse {
        animation: pulse-dot 1.8s ease-in-out infinite;
      }
      .bar-1 { animation: eq-bounce-1 1.2s ease-in-out infinite; }
      .bar-2 { animation: eq-bounce-2 0.9s ease-in-out infinite; }
      .bar-3 { animation: eq-bounce-3 1.4s ease-in-out infinite; }
      .bar-4 { animation: eq-bounce-4 1.1s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base background -->
  <rect width="920" height="310" rx="16" fill="#07080d"/>
  <rect width="920" height="310" rx="16" fill="url(#grid)"/>
  <rect width="920" height="310" rx="16" fill="url(#glow)"/>

  <!-- Top animated laser beam border -->
  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="920" height="1" fill="#1b1e2e"/>
    <rect class="beam-sweep" x="0" y="0" width="460" height="2.5" fill="url(#beam)"/>
  </g>

  <!-- Precision Corner Tech Accents -->
  <path d="M 24 36 L 24 24 L 36 24" fill="none" stroke="#2a3047" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 896 36 L 896 24 L 884 24" fill="none" stroke="#2a3047" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 24 274 L 24 286 L 36 286" fill="none" stroke="#2a3047" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 896 274 L 896 286 L 884 286" fill="none" stroke="#2a3047" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Top Status Pill (Left) -->
  <g transform="translate(48, 30)">
    <rect width="242" height="28" rx="14" fill="#0d101a" stroke="#1d2238" stroke-width="1"/>
    <circle class="pulse" cx="16" cy="14" r="4.5" fill="#3ddc84"/>
    <text x="30" y="18" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.5">KOTLIN 2.X // MEDIA3 EXOPLAYER</text>
  </g>

  <!-- Author Stamp (Right) -->
  <g transform="translate(674, 30)">
    <rect width="198" height="28" rx="14" fill="#131024" stroke="#31224d" stroke-width="1"/>
    <text x="16" y="18" fill="#e0b0ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.8">ENGINEERED BY VARSHUDEV</text>
  </g>

  <!-- Animated Sound Equalizer Spectrum (Right Side) -->
  <g transform="translate(730, 0)">
    <rect class="bar-1" x="0" y="150" width="5" height="30" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-2" x="10" y="145" width="5" height="35" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-3" x="20" y="135" width="5" height="45" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-4" x="30" y="140" width="5" height="40" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-1" x="40" y="155" width="5" height="25" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-3" x="50" y="142" width="5" height="38" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-2" x="60" y="150" width="5" height="30" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-4" x="70" y="138" width="5" height="42" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-1" x="80" y="160" width="5" height="20" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-2" x="90" y="148" width="5" height="32" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-3" x="100" y="136" width="5" height="44" rx="2.5" fill="url(#eq-grad)"/>
    <rect class="bar-4" x="110" y="152" width="5" height="28" rx="2.5" fill="url(#eq-grad)"/>
  </g>

  <!-- Main Hero Title & Subtitle (Absolute Coordinates) -->
  <text x="48" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    A1 SWAARA <tspan fill="#ff2daa">ANDROID</tspan>
  </text>
  <text x="50" y="166" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" letter-spacing="0.2">
    Sovereign High-Fidelity Music Streaming Engine &amp; Studio Suite (Native Kotlin Source)
  </text>

  <!-- Bottom Specification Chips -->
  <g transform="translate(48, 222)">
    <!-- Chip 1 -->
    <rect width="168" height="34" rx="8" fill="#0d111d" stroke="#1b233a" stroke-width="1"/>
    <circle cx="16" cy="17" r="3.5" fill="#3ddc84"/>
    <text x="28" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">JETPACK COMPOSE M3</text>

    <!-- Chip 2 -->
    <rect x="180" y="0" width="168" height="34" rx="8" fill="#0d111d" stroke="#1b233a" stroke-width="1"/>
    <circle cx="196" cy="17" r="3.5" fill="#ff2daa"/>
    <text x="208" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">320 KBPS CD-LOSSLESS</text>

    <!-- Chip 3 -->
    <rect x="360" y="0" width="162" height="34" rx="8" fill="#0d111d" stroke="#1b233a" stroke-width="1"/>
    <circle cx="376" cy="17" r="3.5" fill="#20cfff"/>
    <text x="388" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">MEDIA3 EXOPLAYER</text>

    <!-- Chip 4 -->
    <rect x="534" y="0" width="160" height="34" rx="8" fill="#0d111d" stroke="#1b233a" stroke-width="1"/>
    <circle cx="550" cy="17" r="3.5" fill="#7f52ff"/>
    <text x="562" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">ROOM DB + HTTP/3</text>

    <!-- Chip 5 -->
    <rect x="706" y="0" width="166" height="34" rx="8" fill="#0d111d" stroke="#1b233a" stroke-width="1"/>
    <circle cx="722" cy="17" r="3.5" fill="#10b981"/>
    <text x="734" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="600">SUPABASE CLOUD SYNC</text>
  </g>
</svg>
